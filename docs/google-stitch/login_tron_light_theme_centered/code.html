</div>
<input class="block w-full pl-[40px] pr-md py-sm bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-background placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="operator-id" name="operator-id" placeholder="TRON-XXXX" required="" type="text">
</div>
</div>
<!-- Passkey -->
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="passkey">Passkey</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="key" style="font-size: 18px;">key</span>
</div>
<input class="block w-full pl-[40px] pr-md py-sm bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-background placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="passkey" name="passkey" placeholder="••••••••" required="" type="password">
</div>
</div>

<div class="space-y-sm pt-sm border-t border-surface-variant">
<div class="flex items-center justify-between">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="captcha">Security Verification</label>
<button aria-label="Refresh Captcha" class="text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="refresh" style="font-size: 16px;">refresh</span>
</button>
</div>
<div class="flex gap-md">
<div aria-hidden="true" class="w-1/3 bg-surface-container-high border border-surface-variant rounded-lg flex items-center justify-center font-display font-semibold tracking-widest text-on-background select-none">
                            A7X9
                        </div>
<input class="block w-2/3 px-md py-sm bg-surface-bright border border-outline-variant rounded-lg font-body-md text-body-md text-on-background placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="captcha" name="captcha" placeholder="Enter code" required="" type="text">
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center gap-xs py-sm px-md bg-primary text-on-primary rounded-lg font-body-md text-body-md font-medium hover:bg-inverse-surface transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg flex flex-col items-center space-y-md font-body-sm text-body-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot passkey?</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#"><br></a>
</div>
</main>

<a class="text-xs font-['Inter'] tracking-wide text-zinc-400 dark:text-zinc-600 hover:text-zinc-900 dark:hover:text-zinc-200 underline transition-all opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-xs font-['Inter'] tracking-wide text-zinc-400 dark:text-zinc-600 hover:text-zinc-900 dark:hover:text-zinc-200 underline transition-all opacity-80 hover:opacity-100" href="#">Security Disclosure</a>
</div>
</footer>
