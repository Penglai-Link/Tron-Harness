[package]
name = "tron-computer-use"
version = "0.5.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "ebea2f86f06add31e6ccac1d7a2f25d5d52de520" }
cua-driver-core = { git = "https://github.com/trycua/cua.git", rev = "ebea2f86f06add31e6ccac1d7a2f25d5d52de520" }
fs2 = "0.4"
eliteforge-agent-core = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", rev = "c80a291" }
eliteforge-agent-capability-runtime = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", rev = "c80a291" }
async-trait = "0.1"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi"] }

[profile.release]
strip = "symbols"
lto = "thin"
