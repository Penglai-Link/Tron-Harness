openapi: 3.1.0
info:
  title: Tron API
  description: Tron backend HTTP API. Coverage is added progressively by bounded context.
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HealthData'
  /api/v1/readiness:
    get:
      tags:
      - System
      operationId: readiness
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
components:
  schemas:
    ApiResponse_HealthData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          properties:
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    ApiResponse_ReadinessData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          - components
          properties:
            components:
              $ref: '#/components/schemas/ReadinessComponents'
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    HealthData:
      type: object
      required:
      - status
      - service
      - version
      properties:
        service:
          type: string
        status:
          type: string
        version:
          type: string
    ReadinessComponents:
      type: object
      required:
      - storage
      - graph
      - rag
      properties:
        graph:
          type: string
        rag:
          type: string
        storage:
          type: string
    ReadinessData:
      type: object
      required:
      - status
      - service
      - version
      - components
      properties:
        components:
          $ref: '#/components/schemas/ReadinessComponents'
        service:
          type: string
        status:
          type: string
        version:
          type: string
tags:
- name: System
  description: Service health and readiness

