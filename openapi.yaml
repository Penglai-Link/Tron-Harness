openapi: 3.1.0
info:
  title: Tron API
  description: Tron backend HTTP API. Coverage is added progressively by bounded context.
  license:
    name: ''
  version: 0.1.0-SNAPSHOT
paths:
  /api/v1/health:
    get:
      tags:
      - System
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_HealthData'
  /api/v1/observability/collector/export-config:
    post:
      tags:
      - Observability
      operationId: get_export_config
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CollectorConnection'
  /api/v1/observability/metric-points/query:
    post:
      tags:
      - Observability
      operationId: query_metric_points
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryMetricPointsRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MetricPage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/metrics:
    get:
      tags:
      - Observability
      operationId: get_metrics
      parameters:
      - name: workspaceCode
        in: query
        required: true
        schema:
          type: string
      - name: sessionCode
        in: query
        required: false
        schema:
          type: string
      - name: traceId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TraceMetrics'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/runtime:
    get:
      tags:
      - Observability
      operationId: get_runtime
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RuntimeMetrics'
  /api/v1/observability/traces/query:
    post:
      tags:
      - Observability
      operationId: query_traces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTracesRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TracePage'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/observability/traces/{trace_id}:
    get:
      tags:
      - Observability
      operationId: get_trace
      parameters:
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
      - name: workspaceCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TraceDetail'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EmptyData'
  /api/v1/readiness:
    get:
      tags:
      - System
      operationId: readiness
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ReadinessData'
components:
  schemas:
    ApiResponse_CollectorConnection:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - endpoint
          - authorization
          - traceRetentionDays
          - metricRetentionDays
          - maxTraceRecords
          properties:
            authorization:
              type: string
            endpoint:
              type: string
            maxTraceRecords:
              type: integer
              minimum: 0
            metricRetentionDays:
              type: integer
              format: int64
            traceRetentionDays:
              type: integer
              format: int64
        message:
          type: string
    ApiResponse_EmptyData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
        message:
          type: string
    ApiResponse_HealthData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          properties:
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    ApiResponse_MetricPage:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - current
          - size
          - total
          - records
          properties:
            current:
              type: integer
              minimum: 0
            records:
              type: array
              items:
                $ref: '#/components/schemas/MetricPoint'
            size:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        message:
          type: string
    ApiResponse_ReadinessData:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - status
          - service
          - version
          - components
          properties:
            components:
              $ref: '#/components/schemas/ReadinessComponents'
            service:
              type: string
            status:
              type: string
            version:
              type: string
        message:
          type: string
    ApiResponse_RuntimeMetrics:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - metricPointCount
          properties:
            cpuPercent:
              type:
              - number
              - 'null'
              format: double
            memoryBytes:
              type:
              - integer
              - 'null'
              format: int64
              minimum: 0
            metricPointCount:
              type: integer
              minimum: 0
            sampledAt:
              type:
              - integer
              - 'null'
              format: int64
        message:
          type: string
    ApiResponse_TraceDetail:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - trace
          - spans
          properties:
            spans:
              type: array
              items:
                $ref: '#/components/schemas/TraceSpan'
            trace:
              $ref: '#/components/schemas/TraceSummary'
        message:
          type: string
    ApiResponse_TraceMetrics:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - traceCount
          - failedTraceCount
          - inputTokens
          - outputTokens
          - averageDurationMs
          - p95DurationMs
          properties:
            averageDurationMs:
              type: number
              format: double
            failedTraceCount:
              type: integer
              minimum: 0
            inputTokens:
              type: integer
              format: int64
              minimum: 0
            outputTokens:
              type: integer
              format: int64
              minimum: 0
            p95DurationMs:
              type: number
              format: double
            traceCount:
              type: integer
              minimum: 0
        message:
          type: string
    ApiResponse_TracePage:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
        data:
          type: object
          required:
          - current
          - size
          - total
          - records
          properties:
            current:
              type: integer
              minimum: 0
            records:
              type: array
              items:
                $ref: '#/components/schemas/TraceSummary'
            size:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        message:
          type: string
    CollectorConnection:
      type: object
      required:
      - endpoint
      - authorization
      - traceRetentionDays
      - metricRetentionDays
      - maxTraceRecords
      properties:
        authorization:
          type: string
        endpoint:
          type: string
        maxTraceRecords:
          type: integer
          minimum: 0
        metricRetentionDays:
          type: integer
          format: int64
        traceRetentionDays:
          type: integer
          format: int64
    EmptyData:
      type: object
    HealthData:
      type: object
      required:
      - status
      - service
      - version
      properties:
        service:
          type: string
        status:
          type: string
        version:
          type: string
    MetricPage:
      type: object
      required:
      - current
      - size
      - total
      - records
      properties:
        current:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
        size:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    MetricPoint:
      type: object
      required:
      - pointId
      - name
      - description
      - unit
      - kind
      - temporality
      - monotonic
      - timestamp
      - resource
      - scope
      - data
      properties:
        data: {}
        description:
          type: string
        kind:
          type: string
        monotonic:
          type: boolean
        name:
          type: string
        pointId:
          type: string
        resource:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        scope:
          type: string
        temporality:
          type: integer
          format: int32
        timestamp:
          type: integer
          format: int64
        unit:
          type: string
    QueryMetricPointsRequest:
      type: object
      required:
      - current
      - size
      properties:
        current:
          type: integer
          minimum: 0
        name:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
      additionalProperties: false
    QueryTracesRequest:
      type: object
      required:
      - workspaceCode
      - current
      - size
      properties:
        current:
          type: integer
          minimum: 0
        sessionCode:
          type:
          - string
          - 'null'
        size:
          type: integer
          minimum: 0
        traceId:
          type:
          - string
          - 'null'
        workspaceCode:
          type: string
      additionalProperties: false
    ReadinessComponents:
      type: object
      required:
      - storage
      - graph
      - rag
      properties:
        graph:
          type: string
        rag:
          type: string
        storage:
          type: string
    ReadinessData:
      type: object
      required:
      - status
      - service
      - version
      - components
      properties:
        components:
          $ref: '#/components/schemas/ReadinessComponents'
        service:
          type: string
        status:
          type: string
        version:
          type: string
    RuntimeMetrics:
      type: object
      required:
      - metricPointCount
      properties:
        cpuPercent:
          type:
          - number
          - 'null'
          format: double
        memoryBytes:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        metricPointCount:
          type: integer
          minimum: 0
        sampledAt:
          type:
          - integer
          - 'null'
          format: int64
    SpanEvent:
      type: object
      required:
      - name
      - timestamp
      - attributes
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        name:
          type: string
        timestamp:
          type: integer
          format: int64
    SpanLink:
      type: object
      required:
      - traceId
      - spanId
      properties:
        spanId:
          type: string
        traceId:
          type: string
    TraceDetail:
      type: object
      required:
      - trace
      - spans
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/TraceSpan'
        trace:
          $ref: '#/components/schemas/TraceSummary'
    TraceMetrics:
      type: object
      required:
      - traceCount
      - failedTraceCount
      - inputTokens
      - outputTokens
      - averageDurationMs
      - p95DurationMs
      properties:
        averageDurationMs:
          type: number
          format: double
        failedTraceCount:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        p95DurationMs:
          type: number
          format: double
        traceCount:
          type: integer
          minimum: 0
    TracePage:
      type: object
      required:
      - current
      - size
      - total
      - records
      properties:
        current:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
        size:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    TraceSpan:
      type: object
      required:
      - spanId
      - name
      - startedAt
      - durationMs
      - status
      - attributes
      - events
      - links
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        durationMs:
          type: number
          format: double
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpanEvent'
        links:
          type: array
          items:
            $ref: '#/components/schemas/SpanLink'
        name:
          type: string
        parentSpanId:
          type:
          - string
          - 'null'
        spanId:
          type: string
        startedAt:
          type: integer
          format: int64
        status:
          type: string
    TraceSummary:
      type: object
      required:
      - traceId
      - sessionCode
      - runCode
      - agentCode
      - startedAt
      - durationMs
      - status
      - spanCount
      - errorCount
      - modelCount
      - toolCount
      - inputTokens
      - outputTokens
      properties:
        agentCode:
          type: string
        durationMs:
          type: number
          format: double
        endedAt:
          type:
          - integer
          - 'null'
          format: int64
        errorCount:
          type: integer
          minimum: 0
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        modelCount:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        runCode:
          type: string
        sessionCode:
          type: string
        spanCount:
          type: integer
          minimum: 0
        startedAt:
          type: integer
          format: int64
        status:
          type: string
        toolCount:
          type: integer
          minimum: 0
        traceId:
          type: string
tags:
- name: System
  description: Service health and readiness

