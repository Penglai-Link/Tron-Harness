[package]
license = "AGPL-3.0-only"
name = "tron-harness-capability"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the harness contract independently testable while the application runtime
# and its database adapter are migrated. This is a native, in-process package.
[workspace]

[dependencies]
async-trait = "0.1"
eliteforge-agent-core = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", rev = "c80a291" }
eliteforge-agent-official-plugin-tools-local = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", rev = "c80a291" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
eliteforge-agent-core = { git = "https://gitee.com/person-ai/eliteforge-agent-framework.git", rev = "c80a291" }
