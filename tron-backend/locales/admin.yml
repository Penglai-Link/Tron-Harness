admin.workspaces.code_invalid:
  en: "workspaceCode may contain uppercase letters, digits, underscores and hyphens only."
  zh-CN: "workspaceCode 仅支持大写字母、数字、下划线和连字符。"

admin.workspaces.code_duplicate:
  en: "workspaceCode already exists."
  zh-CN: "workspaceCode 已存在。"

admin.workspaces.name_required:
  en: "Workspace name is required."
  zh-CN: "必须填写工作区名称。"

admin.workspaces.hierarchy_invalid:
  en: "The workspace hierarchy operation is invalid."
  zh-CN: "工作区层级操作无效。"

admin.workspaces.archived_invalid:
  en: "Archived workspaces cannot be modified in this operation."
  zh-CN: "已归档工作区不能进行该操作。"

admin.workspaces.storage_failed:
  en: "Workspace storage operation failed."
  zh-CN: "工作区存储操作失败。"
