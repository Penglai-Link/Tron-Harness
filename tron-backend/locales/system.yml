# System surfaces: variables, system configuration, knowledge graph explorer,
# prompt administration and capability extension descriptions.
#
# Format: rust-i18n `_version: 2`; one flat dotted key per message with both
# supported locales. Keys prefixed `tron.` are stable display-layer keys that
# match the `message_key`/descriptor of application/domain error values; the
# rest are keys owned by inbound HTTP adapters. Never embed user-facing text in
# Rust sources.
_version: 2

# --- Variables (VariableError descriptors) ---
variables.not_found:
  en: "Variable was not found."
  zh-CN: "未找到变量。"

variables.workspace_required:
  en: "workspaceCode is required."
  zh-CN: "必须提供 workspaceCode。"

variables.workspace_invalid:
  en: "The variable workspace must reference an active workspace."
  zh-CN: "变量所属工作区必须为有效工作区。"

variables.key_invalid:
  en: "Variable keys may contain letters, digits, underscores, hyphens and dots only."
  zh-CN: "变量键仅支持字母、数字、下划线、连字符和点。"

variables.value_required:
  en: "A variable value is required."
  zh-CN: "必须填写变量值。"

variables.key_duplicate:
  en: "The variable key already exists in this workspace."
  zh-CN: "当前工作区已存在同名变量键。"

variables.inherited_mutation_denied:
  en: "Override the inherited variable locally before changing it."
  zh-CN: "请先在工作区内覆盖继承变量，再进行修改。"

variables.encryption_not_configured:
  en: "Sensitive value encryption is not configured."
  zh-CN: "尚未配置敏感值加密。"

variables.encrypt_failed:
  en: "The sensitive value could not be encrypted."
  zh-CN: "敏感值加密失败。"

variables.decrypt_failed:
  en: "The sensitive value could not be decrypted."
  zh-CN: "敏感值解密失败。"

variables.sensitive_upgrade_value_required:
  en: "Changing the type to sensitive requires a replacement value."
  zh-CN: "改为敏感类型时必须提供新值。"

variables.sensitive_downgrade_value_required:
  en: "Changing the type from sensitive requires a replacement value."
  zh-CN: "取消敏感类型时必须提供新值。"

variables.sensitive_override_required:
  en: "Inherited sensitive variables must be overridden with a sensitive value first."
  zh-CN: "覆盖继承的敏感变量前，请先提供敏感值。"

variables.storage_failed:
  en: "Variable storage operation failed."
  zh-CN: "变量存储操作失败。"

# --- Knowledge graph explorer (GraphError descriptors) ---
knowledge_graph.request_invalid:
  en: "Knowledge graph request is invalid."
