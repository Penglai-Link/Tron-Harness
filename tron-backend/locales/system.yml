  zh-CN: "知识图谱存储失败。"

# --- System configuration (SystemConfigError descriptors) ---
system_config.read_failed:
  en: "Configuration file could not be read."
  zh-CN: "无法读取配置文件。"

system_config.invalid:
  en: "Backend configuration is invalid: %{detail}"
  zh-CN: "后端配置无效：%{detail}"

system_config.field_invalid:
  en: "Configuration field `%{path}` is not editable."
  zh-CN: "配置字段 `%{path}` 不可编辑。"

system_config.revision_conflict:
  en: "Configuration changed since it was loaded; refresh and retry."
  zh-CN: "配置已发生变化，请刷新后重试。"

system_config.migration_confirmation_required:
  en: "Migration-related configuration changes require confirmation."
  zh-CN: "迁移相关的配置变更需要确认。"

system_config.write_failed:
  en: "Configuration file could not be updated atomically."
  zh-CN: "配置文件的原子更新失败。"

system_config.crypto_reload_failed:
  en: "The encryption key could not be reloaded; restart the backend and retry."
  zh-CN: "加密密钥重新加载失败，请重启后端后重试。"

