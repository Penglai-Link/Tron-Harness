bindAddress: 127.0.0.1
port: 8080
frontendDistDir: tron-backend/resources/frontend
projectDocRoot: .

resource:
  connectionVerificationTimeoutMs: 5000
  storage:
    defaultProfile: local-default
    profiles:
      local-default:
        type: local
        root: ~/.tron/resources
  limits:
    schemaMaxBytes: 1048576
    attributesMaxBytes: 1048576
    maxDepth: 128
    maxValidationErrors: 100
    maxBinaries: 500
    maxBinaryBytes: 1073741824
    maxCommitBytes: 1073741824
    maxBinaryNameLength: 255

systemAgents:
  codexCommand: codex
  opencodeCommand: opencode

httpClients:
  default:
    connectTimeoutMs: 1500
    poolIdleTimeoutMs: 90000
    poolMaxIdlePerHost: 32
    tcpKeepaliveMs: 30000
  documentParsing:
    connectTimeoutMs: 1500
    poolIdleTimeoutMs: 90000
    poolMaxIdlePerHost: 8
    tcpKeepaliveMs: 30000

mineru:
  enabled: true
  baseUrl: https://pre-platform.cisdigital.cn/mineru
  parseEndpoint: /file_parse
  timeoutSeconds: 300
  maxBytes: 52428800
  backend: pipeline
  parseMethod: auto
  returnContentList: false

shortTermMemory:
  toolOutput:
    root: ~/.tron/artifacts/short-term-memory/tool-results
    externalizeAboveBytes: 32768
  eventLog:
    mode: full
    retentionDays: 5
    maxPayloadBytes: 8192
    cleanupOnStartup: true
    cleanupBatchSize: 5000
    cleanupMaxRowsPerStartup: 50000
  context:
    defaultContextWindowTokens: 32000
    familyContextMaxChars: 6000
    reasoningSummaryReplayEnabled: false
    blocks:
      seedPromptPrefix:
        maxRatioBps: 5000
        maxTokens: 16000
      currentSessionCheckpoint:
        maxRatioBps: 2000
        maxTokens: 6000
      sessionFamilyContext:
        maxRatioBps: 1000
        maxTokens: 12000
      currentSessionWorkingState:
        maxRatioBps: 1000
        maxTokens: 2000
  familyLoad:
    defaultMaxSnapshots: 3
    defaultMaxSessions: 3
    defaultSnapshotMaxChars: 2000
    defaultTtlHours: 72
    taskWeightBps: 6500
    requirementWeightBps: 2500
    workspaceChatWeightBps: 1000
    workspaceHeartbeatWeightBps: 1000
    otherWeightBps: 500
  compaction:
    triggerRatioBps: 8000
    retainedHistoryRatioBps: 2000
  goalLoop:
    maxRuns: 20
    maxConsecutiveJudgeFailures: 3
    judgeInputMaxChars: 12000
    judgeOutputMaxTokens: 1024

variableCrypto:
  keyBase64: sbxNdQm4XiwQyfXNEtjZCQ==

auth:
  jwtSecret: tron-dev-jwt-secret
  accessTokenTtlSeconds: 900
  refreshTokenTtlSeconds: 604800
  cookieSecure: false
  devOauth2Enabled: false
  devOauth2Name: OAuth2
  githubOauth:
    enabled: true
    clientId: "Ov23likwYzrsRscebvyk"
    clientSecret: "0d5f436e54adade4041db7ecfd0b7b6c30058399"
    redirectUri: http://127.0.0.1:5173/api/v1/auth/oauth2/callback/github
    name: GitHub
    scope: "read:user user:email"
    authorizeUrl: https://github.com/login/oauth/authorize
    tokenUrl: https://github.com/login/oauth/access_token
    userApiUrl: https://api.github.com/user
    emailsApiUrl: https://api.github.com/user/emails
  # Optional LDAP credential login.
  # The following `.env` variable names can override this block at runtime:
  # LDAP_URL, LDAP_BIND_DN, LDAP_BIND_PASSWORD, LDAP_SEARCH_BASE, LDAP_SEARCH_FILTER
  # ldap:
  #   url: ldap://127.0.0.1:389
  #   bindDn: cn=service,dc=example,dc=com
  #   bindPassword: change-me
  #   searchBase: ou=people,dc=example,dc=com
  #   searchFilter: (|(uid={login})(mail={login}))

eventBus:
  enabled: true
  criticalIngressCapacity: 128
  standardIngressCapacity: 512
  defaultSinkCapacity: 256
  maxNameBytes: 96
  maxProducerBytes: 48
  maxSummaryBytes: 160
  maxAttrs: 8
  maxAttrKeyBytes: 32
  maxAttrValueBytes: 8192
  maxPayloadFields: 8
  maxPayloadBytes: 8192
  maxSubjectTypeBytes: 32
  maxSubjectCodeBytes: 64
  maxActorUserCodeBytes: 64
  maxActorUsernameBytes: 64
  maxRequestFieldBytes: 64
  aguiReplayEventsPerStream: 32
  aguiReplayBytesPerStream: 65536
  aguiGlobalReplayBytes: 2097152
  aguiStreamIdleTtlSeconds: 30
