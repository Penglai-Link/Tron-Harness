bindAddress: 127.0.0.1
navigation:
  maxDepth: 3
port: 8080
frontendDistDir: tron-backend/resources/frontend
terminalWorkingDirectory: .

resource:
  connectionVerificationTimeoutMs: 5000
  storage:
    defaultProfile: local-default
    profiles:
      local-default:
        type: local
        root: ~/.tron/resources
      # Example S3-compatible profile. Set defaultProfile to this profile and
      # export the three credential variables before starting the backend.
      # s3-default:
      #   type: s3
      #   endpoint: https://s3.example.com
      #   region: us-east-1
      #   bucket: tron-resources
      #   prefix: attachments
      #   forcePathStyle: false
      #   accessKeyIdEnv: AWS_ACCESS_KEY_ID
      #   secretAccessKeyEnv: AWS_SECRET_ACCESS_KEY
      #   sessionTokenEnv: AWS_SESSION_TOKEN
  limits:
    schemaMaxBytes: 1048576
    attributesMaxBytes: 1048576
    maxDepth: 128
    maxValidationErrors: 100
    maxBinaries: 500
    maxBinaryBytes: 1073741824
    maxCommitBytes: 1073741824
    maxBinaryNameLength: 255

systemAgents:
  codexCommand: codex
  opencodeCommand: opencode

# Model budgets are read at the next invocation; batch limits at the next embedding batch.
modelInvocation:
  text:
    callTimeoutSeconds: 300
    operationTimeoutSeconds: 900
  embedding:
    callTimeoutSeconds: 180
    operationTimeoutSeconds: 600
    maxBatchInputs: 32
    maxBatchTokens: 32768
  rerank:
    callTimeoutSeconds: 60
    operationTimeoutSeconds: 180
  verification:
    callTimeoutSeconds: 60
    operationTimeoutSeconds: 180
  agentModelTimeoutSeconds: 300
  agentStepTimeoutSeconds: 300
  externalAgent:
    callTimeoutSeconds: 3600
    operationTimeoutSeconds: 3600

httpClients:
  default:
    connectTimeoutMs: 1500
    poolIdleTimeoutMs: 90000
    poolMaxIdlePerHost: 32
    tcpKeepaliveMs: 30000
  documentParsing:
    connectTimeoutMs: 1500
    poolIdleTimeoutMs: 90000
    poolMaxIdlePerHost: 8
    tcpKeepaliveMs: 30000

mineru:
  ocrMode: ocr
  parserProfile: mineru-4.0.10-ocr
  expectedParserVersion: "4.0.10"
  ingestion:
    parseCapacity: 2
    embeddingCapacity: 2
    # Set the same group as a parser node only when both use the same hardware.
    embeddingResourceGroup: null
    embeddingResourceGroupCapacity: 2
    leaseMs: 30000
    pollMs: 250
    maxAttempts: 3
    retryBackoffMs: 2000
  # Empty: use baseUrl (an official MinerU router can be this endpoint).
  # Nodes: id, baseUrl, enabled, allowRemote, capacity, weight,
  # resourceGroup, resourceGroupCapacity. Remote nodes are disabled by default.
  nodes: []
  # Optional Framework SDK supplement; enabling sends extracted images to PersonAI.
  # Opt-in only: sends authorized KB images to the selected answer model.
  visualContextEnabled: false
  imageDescription:
    enabled: false
    modelCode: ""
    maxImagesPerDocument: 64
    timeoutSeconds: 30
  defaultTier: standard
  enabled: true
  baseUrl: http://127.0.0.1:8000
  parseEndpoint: /file_parse
  timeoutSeconds: 1200
  maxBytes: 52428800
  backend: pipeline
  parseMethod: auto
  returnContentList: false

shortTermMemory:
  context:
    defaultContextWindowTokens: 32000
    familyContextMaxChars: 6000
    blocks:
      seedPromptPrefix:
        maxRatio: "50%"
        maxTokens: 16000
      currentSessionCheckpoint:
        maxRatio: "20%"
        maxTokens: 6000
      sessionFamilyContext:
        maxRatio: "10%"
        maxTokens: 12000
      currentSessionWorkingState:
        maxRatio: "10%"
        maxTokens: 2000
      toolSchema:
        # Preserve existing DirectList agents. Set a tighter measured limit per deployment.
        # Example: maxRatio: "20%" and maxTokens: 6000.
        maxRatio: "60%"
    providers:
      order:
        - seed_prompt_prefix
        - application_context
        - current_session_checkpoint
        - session_family_context
        - current_session_working_state
        - knowledge_base
        - current_session_history
      checkpoint:
        strategy: bound
        triggerRatio: "100%"
        targetRatio: "80%"
        minGainTokens: 1
      family:
        strategy: bound
        triggerRatio: "100%"
        targetRatio: "80%"
        minGainTokens: 1
      working:
        strategy: bound
        triggerRatio: "100%"
        targetRatio: "80%"
        minGainTokens: 1
      history:
        strategy: checkpoint
        triggerRatio: "100%"
        targetRatio: "20%"
        minGainTokens: 1
      maxAuxiliaryCallsPerStep: 16
  familyLoad:
    defaultMaxSessions: 3
  compaction:
    autoEnabled: true
    triggerRatio: "80%"
  goalLoop:
    maxRuns: 20

variableCrypto:
  keyBase64: sbxNdQm4XiwQyfXNEtjZCQ==

eventBus:
  enabled: true
  criticalIngressCapacity: 128
  standardIngressCapacity: 512
  defaultSinkCapacity: 256
  maxNameBytes: 96
  maxProducerBytes: 48
  maxSummaryBytes: 160
  maxAttrs: 8
  maxAttrKeyBytes: 32
  maxAttrValueBytes: 8192
  maxPayloadFields: 8
  maxPayloadBytes: 8192
  maxSubjectTypeBytes: 32
  maxSubjectCodeBytes: 64
  maxActorUserCodeBytes: 64
  maxActorUsernameBytes: 64
  maxRequestFieldBytes: 64
  aguiReplayEventsPerStream: 32
  aguiReplayBytesPerStream: 65536
  aguiGlobalReplayBytes: 2097152
  aguiStreamIdleTtlSeconds: 30
