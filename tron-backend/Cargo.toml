[package]
name = "tron-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm-siv = "0.11"
axum = "0.8"
async-stream = "0.3"
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = "0.12"
gmcrypto-core = { version = "1.0.0", features = ["sm4-aead"] }
grafeo = { version = "0.5.42", default-features = false, features = ["embedded", "storage"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
ldap3 = "0.12.1"
rand = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
snowflaked = { version = "1.0.3", features = ["sync"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-cron = "0.1.3"
tower-http = { version = "0.6", features = ["cors"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
