[package]
name = "tron-backend"
version = "0.1.0-SNAPSHOT"
edition = "2024"
publish = false

[dependencies]
eliteforge-agent-official-plugin-skills = { path = "../.agent-deps/agent-framework/crates/plugin/skill/eliteforge-agent-official-plugin-skills" }
eliteforge-agent-plugin-core = { path = "../.agent-deps/agent-framework/crates/framework/eliteforge-agent-plugin-core" }
eliteforge-agent-official-plugin-agui = { path = "../.agent-deps/agent-framework/crates/plugin/protocol/eliteforge-agent-official-plugin-agui" }
eliteforge-agent-memory = { path = "../.agent-deps/agent-framework/crates/plugin/memory/eliteforge-agent-memory" }
eliteforge-agent-official-plugin-model-http = { path = "../.agent-deps/agent-framework/crates/plugin/model/eliteforge-agent-official-plugin-model-http" }
eliteforge-agent-official-plugin-tools-human = { path = "../.agent-deps/agent-framework/crates/plugin/tool/eliteforge-agent-official-plugin-tools-human" }
eliteforge-agent-capability-external = { path = "../.agent-deps/agent-framework/crates/capability/eliteforge-agent-capability-external" }
async-trait = "0.1"
tokio-util = "0.7"
eliteforge-agent-official-plugin-tools-mcp = { path = "../.agent-deps/agent-framework/crates/plugin/tool/eliteforge-agent-official-plugin-tools-mcp" }
eliteforge-agent-capability-tools = { path = "../.agent-deps/agent-framework/crates/capability/eliteforge-agent-capability-tools" }
tron-agent-harness = { path = "crates/tron-agent-harness" }
eliteforge-agent-core = { path = "../.agent-deps/agent-framework/crates/framework/eliteforge-agent-core" }
eliteforge-agent-framework = { path = "../.agent-deps/agent-framework/crates/framework/eliteforge-agent-framework", default-features = false }
eliteforge-agent-capability-runtime = { path = "../.agent-deps/agent-framework/crates/framework/eliteforge-agent-capability-runtime" }
eliteforge-agent-official-plugin-tools-local = { path = "../.agent-deps/agent-framework/crates/plugin/tool/eliteforge-agent-official-plugin-tools-local" }
eliteforge-agent-official-plugin-storage-local = { path = "../.agent-deps/agent-framework/crates/plugin/storage/eliteforge-agent-official-plugin-storage-local" }
aes-gcm-siv = "0.11"
axum = { version = "0.8", features = ["multipart"] }
async-stream = "0.3"
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crab-serverapi = { git = "https://gitee.com/person-ai/person-ai-index-rust-sdk.git", rev = "89a853199f6db4ba6a4003d5930bcdc2e96c6bf2" }
cron = "0.12"
gmcrypto-core = { version = "1.0.0", features = ["sm4-aead"] }
grafeo = { version = "0.5.42", default-features = false, features = ["embedded", "storage"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
jsonschema = { version = "0.47", default-features = false }
opendal = { version = "=0.57.0", default-features = false, features = ["blocking", "executors-tokio", "reqwest-rustls-tls", "services-s3"] }
ldap3 = "0.12.1"
rand = "0.9.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rskafka = { version = "0.6", default-features = false, features = ["transport-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
redis = { version = "0.32.7", default-features = false, features = ["cluster-async", "tokio-rustls-comp"] }
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
tokio-rusqlite = { version = "0.7.0", features = ["bundled"] }
russh = { version = "0.62.6", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
serde_json = "1"
semver = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
snowflaked = { version = "1.0.3", features = ["sync"] }
socketioxide = { version = "0.18.6", features = ["state"] }
sqlx = { version = "0.8.6", default-features = false, features = ["mysql", "postgres", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-cron = "0.1.3"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "yaml"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
umya-spreadsheet = "3.1"
pdf-extract = "0.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
eliteforge-agent-test-support = { path = "../.agent-deps/agent-framework/crates/testing/eliteforge-agent-test-support" }
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
# The desktop sidecar is distributed to end users.  These settings remove
# symbol names and enable cross-crate optimization, raising the cost of
# reverse engineering without changing the executable's public behavior.
strip = "symbols"
lto = "thin"
