version: 1
agents:
  main:
    role: Lead Multi-Agent Orchestrator
    description: First agent that activates the skill; owns user gates, contracts, selected git-spec worktree orchestration, subagent dispatch, integration, and final review.
  explorer:
    role: Explorer Agent
    description: Read-only repository inspection agent. No edits.
  red-test-worker:
    role: RED Test Worker
    description: Creates failing tests first in a selected-git-spec worktree and records RED evidence.
  green-backend-worker:
    role: GREEN Backend Worker
    description: Implements backend behavior after RED evidence is integrated.
  green-frontend-worker:
    role: GREEN Frontend Worker
    description: Implements frontend behavior after RED evidence is integrated.
  green-database-worker:
    role: GREEN Database Worker
    description: Implements migrations, persistence, and DB verification after approved database design and RED evidence.
  verify-worker:
    role: Verify Worker
    description: Runs approved validation commands after integration.
  review-worker:
    role: Review Worker
    description: Reviews traceability, evidence, and final acceptance.
